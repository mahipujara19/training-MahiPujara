<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book A Table</title>
    <style>
        :root {
            --primary-color: #ce1212;
            --secondary-color: #37373f;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .booking-container {
            background: var(--card-background);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 10px;
            font-size: 28px;
        }

        p.subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary-color);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #b10f0f;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h1>Book a Table</h1>
    <p class="subtitle">Experience exquisite dining. Reserve your spot today.</p>
    
    <form action="#" method="get">
        <!-- Name Field -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" name="customer_name" id="name" placeholder="John Doe" required>
        </div>

        <div class="form-row">
            <!-- Time Slot Field -->
            <div class="form-group">
                <label for="time">Time Slot</label>
                <input type="time" name="booking_time" id="time" required>
            </div>

            <!-- Guests Field -->
            <div class="form-group">
                <label for="guests">Guests (Max 5)</label>
                <input type="number" name="total_guests" id="guests" max="5" min="1" value="2" required>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit">Book Now</button>
    </form>
</div>

</body>
</html>
